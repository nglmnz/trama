 C2 (Bajos de Mena): 6200 Ton<br>• C3 (San Carlos): 4800 Ton<br>• C4 (Rural): 500 Ton","<b>Rutas de Recolección:<\/b><br>• Optimización de micro-rutas para el triciclo/carro de recicladores, evitando competir con el camión recolector tradicional.","<b>Condiciones Laborales:<\/b><br>• Brecha crítica: El 68% opera en informalidad en las calles. Urge un sistema de pago por servicio de recolección.","<b>Incentivos:<\/b><br>• Piloto de 'Eco-puntos' canjeables por beneficios municipales o rebajas en los derechos de aseo domiciliario.","<b>Trazabilidad del Flujo:<\/b><br>• Domiciliario: Baja (Mezclado en camión DIMAO)<br>• Industrial/REP: Media-Alta (Declarado en Ventanilla Única RETC)","<b>Datos Territoriales (SIG):<\/b><br>• Cruce crítico: Mapeo de microbasurales vs ubicaciones de tolvas comunitarias para erradicación de focos.","<b>Impacto Ambiental y Social:<\/b><br>• Reducción de huella de carbono comunal y formalización del empleo vulnerable (Sindicatos de recicladores)."]},"edges":{"from":[1,1,1,2,2,3,3,5,5,4,4,6,7,8,9,12,10,11],"to":[2,10,9,8,3,13,11,2,11,6,12,7,8,12,13,14,14,1],"label":["Operan / Abastecen","Determinan","Recorren","Registran","Co-gestionan","Planifican con","Regulan","Sostienen","Reciben","Contratan","Reportan (Ley REP)","Procesan","Se miden en","Insuman","Se mapean","Evidencian","Alimentan","Movilizan"]},"nodesToDataframe":true,"edgesToDataframe":true,"options":{"width":"100%","height":"100%","nodes":{"shape":"dot","size":30,"font":{"face":"Helvetica","size":15},"shadow":true},"manipulation":{"enabled":false},"groups":{"Humano/Actor":{"color":"#FC8D62","shape":"dot"},"Infraestructura":{"color":"#66C2A5","shape":"database"},"Institucional":{"color":"#8DA0CB","shape":"hexagon"},"Flujo/Material":{"color":"#E78AC3","shape":"diamond"},"Métrica/Dato":{"color":"#A6D854","shape":"icon"},"useDefaultGroups":true,"Dimensión Social":{"color":"#FFD92F","shape":"star"}},"edges":{"width":2,"color":{"color":"#d3d3d3","highlight":"#3498db"},"smooth":{"type":"curv
